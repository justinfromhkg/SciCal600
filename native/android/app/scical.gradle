def buildNumber = System.getenv('SCICAL_VERSION_CODE') ?: '1'
if (!(buildNumber ==~ /[0-9]+/)) throw new GradleException('Invalid version code')
android {
    defaultConfig {
        versionCode buildNumber.toInteger()
        versionName System.getenv('SCICAL_VERSION_NAME') ?: '0.3.0'
    }
}
// Release signing uses the Android SDK apksigner in CI, with secrets via env.
// No production keystore is generated by this project.
