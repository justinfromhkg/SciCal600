name: Android APK
on:
  workflow_call:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm preinstalled Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and integration tests
        run: npm test
      - name: Web build
        run: npm run build
      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Prepare native project (including repeat-sync check)
        run: |
          npm run android:sync
          npm run android:sync
      - name: Gradle debug build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - name: Verify APK signature, identity and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SciCal600-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose artifacts/SciCal600-debug.apk
          "$BUILD_TOOLS/aapt" dump badging artifacts/SciCal600-debug.apk > artifacts/apk-badging.txt
          grep "package: name='io.github.justinfromhkg.scical600'" artifacts/apk-badging.txt
          (cd artifacts && sha256sum SciCal600-debug.apk > SHA256SUMS)
          stat -c '%n %s bytes' artifacts/SciCal600-debug.apk | tee artifacts/size.txt
          cp package-lock.json artifacts/
      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SciCal600-debug
          path: artifacts/
          retention-days: 90
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch offline on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install artifacts/SciCal600-debug.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n io.github.justinfromhkg.scical600/.MainActivity
            adb shell input keyevent KEYCODE_BACK
            adb shell am start -W -n io.github.justinfromhkg.scical600/.MainActivity
            adb shell pidof io.github.justinfromhkg.scical600
            node tests/android-smoke.cjs
      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-smoke-evidence
          path: artifacts/android-offline.png
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm preinstalled Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version"
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Build unsigned release
        env:
          SCICAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x android/gradlew
          cd android
          SCICAL_VERSION_NAME="${GITHUB_REF_NAME#v}" ./gradlew assembleRelease lintRelease --no-daemon
      - name: Sign with production secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$EXPECTED_CERT_SHA256"
          trap 'rm -f "$RUNNER_TEMP/scical-release.jks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/scical-release.jks"
          chmod 600 "$RUNNER_TEMP/scical-release.jks"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/scical-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out SciCal600-Android.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs SciCal600-Android.apk | tee signing-certificate.txt
          ACTUAL_CERT_SHA256=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}' signing-certificate.txt | tr -d ':[:space:]')
          NORMALIZED_EXPECTED_CERT_SHA256=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$NORMALIZED_EXPECTED_CERT_SHA256"
          "$BUILD_TOOLS/aapt" dump badging SciCal600-Android.apk > apk-badging.txt
          EXPECTED_VERSION_NAME="${GITHUB_REF_NAME#v}"
          grep "package: name='io.github.justinfromhkg.scical600'" apk-badging.txt
          grep "versionCode='${GITHUB_RUN_NUMBER}'" apk-badging.txt
          grep "versionName='$EXPECTED_VERSION_NAME'" apk-badging.txt
          sha256sum SciCal600-Android.apk > SHA256SUMS
      - name: Publish stable Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" SciCal600-Android.apk SHA256SUMS signing-certificate.txt apk-badging.txt --clobber

  debug-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SciCal600-debug
          path: artifacts
      - name: Publish verified debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DEBUG_TAG="android-debug-${GITHUB_SHA:0:12}"
          LATEST_TAG="android-debug-latest"
          NOTES="Installable development APK. Passed Web tests, Gradle build/signature checks and Android emulator offline checks. Uses a development signing key, not the production key."

          gh release view "$DEBUG_TAG" >/dev/null 2>&1 || gh release create "$DEBUG_TAG" --target "$GITHUB_SHA" --prerelease --title "SciCal600 Android debug (${GITHUB_SHA:0:12})" --notes "$NOTES"
          gh release upload "$DEBUG_TAG" artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt --clobber

          gh release delete "$LATEST_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$LATEST_TAG" --target "$GITHUB_SHA" --title "SciCal600 Android APK · verified test build" --notes "$NOTES"
          gh release upload "$LATEST_TAG" artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt --clobber
